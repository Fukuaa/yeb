spring:
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:mysql://192.168.240.10:3306/yeb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  rabbitmq:
    virtual-host: ${RABBITMQ_VHOST:/}
    host: ${RABBITMQ_HOST:192.168.240.10}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false
  redis:
    host: ${REDIS_HOST:192.168.240.10}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
app:
  mail:
    from: ${MAIL_FROM:}
    queue: ${MAIL_QUEUE:mail.queue}
    exchange: ${MAIL_EXCHANGE:mail.exchange}
    routing-key: ${MAIL_ROUTING_KEY:mail.routing.key}
